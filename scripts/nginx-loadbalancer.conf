# Spheronix Hackathon - Nginx Load Balancer Configuration
# Place in: /etc/nginx/sites-available/hackathon.conf
# Enable: ln -s /etc/nginx/sites-available/hackathon.conf /etc/nginx/sites-enabled/

# 1. Define Backend Upstream Pool
# This distributes traffic across multiple FastAPI backend instances
upstream hackathon_backend {
    # Load balancing algorithms available:
    # - round-robin (default)
    # - least_conn (sends request to instance with fewest active connections)
    # - ip_hash (ensures same client IP goes to the same backend instance)
    least_conn;

    # Instance 1
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    # Instance 2 (if running on same server on second port)
    server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
    # Instance 3 (if running on a secondary server IP in your private network)
    # server 10.0.0.2:8000 max_fails=3 fail_timeout=10s;

    keepalive 64;
}

# 2. Concurrency Shock Absorber (Protects server from 10,000 simultaneous connections)
# Allows up to 100 requests/second per IP with burst capacity
limit_req_zone $binary_remote_addr zone=hackathon_req:20m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=hackathon_conn:20m;

# 2. Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name puhackathon.spheronixtechnology.com;

    # Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 3. HTTPS Server (Load Balancer & SSL Termination)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name puhackathon.spheronixtechnology.com;

    # SSL Certificates (managed by Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # SSL Security parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Request limits & client body size for receipt uploads
    client_max_body_size 10M;

    # Static Assets (can be served directly by Nginx for high performance)
    location /static/ {
        alias /opt/hackathon/app/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Uploaded receipts / media
    location /uploads/ {
        alias /opt/hackathon/app/static/uploads/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Health Check endpoint for Load Balancer / Monitoring
    location = /api/health {
        proxy_pass http://hackathon_backend/api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    # Virtual Waiting Room Static Route (zero Python load)
    location = /waiting-room.html {
        alias /opt/hackathon/app/static/waiting-room.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API & Dynamic App Requests -> Forwarded to Load Balancer Upstream
    location / {
        # Concurrency protection: buffers burst traffic cleanly
        limit_req zone=hackathon_req burst=200 nodelay;
        limit_conn hackathon_conn 50;

        proxy_pass http://hackathon_backend;
        proxy_http_version 1.1;

        # Critical Headers for FastAPI & SlowAPI Rate Limiter
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
