# Spheronix Hackathon - High-Concurrency Nginx Load Balancer
# Upstream load balancing across multiple FastAPI instances

upstream hackathon_backend {
    least_conn; # Routes traffic to instance with fewest active connections

    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;

    keepalive 64;
}

# Concurrency Shock Absorber (Prevents crash when 10,000 students hit at once)
limit_req_zone $binary_remote_addr zone=hackathon_req:20m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=hackathon_conn:20m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name studentregistration.spheronixtechnology.in puhackathon.spheronixtechnology.com _;

    # Client upload size for receipts
    client_max_body_size 10M;

    # Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Static Assets (served directly by Nginx with 0 Python load)
    location /static/ {
        alias /home/ubuntu/hack/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Uploaded receipts / media
    location /uploads/ {
        alias /home/ubuntu/hack/static/uploads/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Health Check endpoint
    location = /api/health {
        proxy_pass http://hackathon_backend/api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    # Virtual Waiting Room Static Route (Zero Python load)
    location = /waiting-room.html {
        alias /home/ubuntu/hack/static/waiting-room.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API & Dynamic App Requests -> Forwarded to Load Balancer Upstream
    location / {
        limit_req zone=hackathon_req burst=200 nodelay;
        limit_conn hackathon_conn 50;

        proxy_pass http://hackathon_backend;
        proxy_http_version 1.1;

        # Automatic failover (prevents 502 Bad Gateway)
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;

        # Critical Headers for FastAPI & Client IP Detection
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
